name: Mirror Images to Aliyun ACR

on:
  push:
    branches:
      - main
    paths:
      - 'images.txt'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制全量同步 images.txt 中所有镜像（忽略 diff）'
        required: false
        type: boolean
        default: false

# 同一分支的多次推送按顺序执行，避免并发冲突
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于计算 diff

      - name: Get images to mirror
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCE_SYNC: ${{ inputs.force_sync || github.event.inputs.force_sync || 'false' }}
        run: |
          set -uo pipefail

          if [ "${FORCE_SYNC}" = "true" ]; then
            # 手动触发 — 全量同步文件中所有镜像
            echo "Force sync: processing ALL images in images.txt"
            ADDED=$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' images.txt | sort -u)
          elif [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            # 首次推送到分支 — 文件中所有镜像都视为新增
            ADDED=$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' images.txt | sort -u)
          else
            # 仅取新增行（以 + 开头），忽略删除行（以 - 开头）
            ADDED=$(git diff "${BEFORE}" "${AFTER}" -- images.txt \
              | grep '^+' \
              | grep -v '^+++' \
              | sed 's/^+//' \
              | sed '/^[[:space:]]*#/d' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u \
              || true)
          fi

          if [ -z "${ADDED}" ]; then
            echo "No images to mirror."
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<images_end"
              echo "${ADDED}"
              echo "images_end"
            } >> "$GITHUB_OUTPUT"
            COUNT=$(echo "${ADDED}" | wc -l)
            echo "Found ${COUNT} image(s) to mirror."
          fi

      - name: Install skopeo
        if: steps.diff.outputs.has_images == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Login to Aliyun ACR
        if: steps.diff.outputs.has_images == 'true'
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          echo "${ALIYUN_PASSWORD}" | skopeo login "${ALIYUN_REGISTRY}" \
            -u "${ALIYUN_USERNAME}" \
            --password-stdin
          # buildx imagetools 使用 docker 凭据；docker login 只接受 host（ALIYUN_REGISTRY 含命名空间路径）
          echo "${ALIYUN_PASSWORD}" | docker login "${ALIYUN_REGISTRY%%/*}" \
            -u "${ALIYUN_USERNAME}" \
            --password-stdin

      - name: Copy images with skopeo
        id: copy
        if: steps.diff.outputs.has_images == 'true'
        env:
          IMAGES: ${{ steps.diff.outputs.images }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          set -uo pipefail

          SUCCESS=0
          FAILED=0
          FAILED_IMAGES=""

          while IFS= read -r image; do
            [ -z "$image" ] && continue

            echo "::group::Mirror: ${image}"
            # 取最后一段作为仓库名，如 lmsysorg/sglang:v0.5.16 -> sglang:v0.5.16
            short_name="${image##*/}"
            target="${ALIYUN_REGISTRY}/${short_name}"

            # 读取源镜像原始 manifest，检测 manifest list 是否包含 attestation 清单
            # （buildx 生成的 provenance/SBOM，platform 为 unknown/unknown，
            #   config 为 application/vnd.oci.empty.v1+json，阿里云 ACR 会拒绝接收）
            RAW=$(skopeo inspect --raw "docker://${image}" 2>/dev/null || true)
            HAS_ATTESTATION=false
            if [ -n "${RAW}" ] && echo "${RAW}" | jq -e 'has("manifests")' >/dev/null 2>&1; then
              ATT=$(echo "${RAW}" | jq '[.manifests[] | select(
                ((.platform.os? // "") == "unknown" and (.platform.architecture? // "") == "unknown")
                or ((.annotations?["vnd.docker.reference.type"] // "") == "attestation-manifest")
              )] | length')
              [ "${ATT:-0}" -gt 0 ] && HAS_ATTESTATION=true
            fi

            copy_ok=false

            if [ "${HAS_ATTESTATION}" = "true" ]; then
              # 剔除 attestation 清单：逐架构用 skopeo 复制（自动跳过目标已有 blob），
              # 再用 buildx imagetools create 在 ACR 侧重组 manifest list
              # （子 manifest 已在 ACR，重组是秒级；且 ACR 上无 referrers，attestation 不会被带回）
              dst_repo="${target%%:*}"
              ENTRIES=$(echo "${RAW}" | jq -r '
                [.manifests[] | select(
                  (((.platform.os? // "") == "unknown" and (.platform.architecture? // "") == "unknown")
                  or ((.annotations?["vnd.docker.reference.type"] // "") == "attestation-manifest"))
                  | not)]
                | if any(.platform == null) then
                    "UNSAFE"
                  else
                    (map(.digest + " " + .platform.os + " " + .platform.architecture + " " + (.platform.variant // "")) | .[])
                  end')

              if echo "${ENTRIES}" | grep -qx 'UNSAFE'; then
                echo "  manifest list contains entries without platform info, cannot strip attestations safely"
              else
                CREATE_ARGS=()
                arch_ok=true
                while IFS= read -r entry; do
                  [ -z "$entry" ] && continue
                  digest=$(echo "$entry" | awk '{print $1}')
                  os=$(echo "$entry" | awk '{print $2}')
                  arch=$(echo "$entry" | awk '{print $3}')
                  variant=$(echo "$entry" | awk '{print $4}')
                  tmp_tag="__tmp_${os}_${arch}"
                  [ -n "$variant" ] && tmp_tag="${tmp_tag}_${variant}"

                  echo "  copy ${os}/${arch}${variant:+/$variant} -> ${dst_repo}:${tmp_tag}"
                  if ! skopeo copy "docker://${image}@${digest}" "docker://${dst_repo}:${tmp_tag}"; then
                    arch_ok=false
                    break
                  fi

                  # skopeo 正常不会改动 manifest；若 digest 有变化，以实际推送的为准
                  pushed=$(skopeo inspect --format '{{.Digest}}' "docker://${dst_repo}:${tmp_tag}" 2>/dev/null || true)
                  if [ -n "$pushed" ] && [ "$pushed" != "$digest" ]; then
                    echo "  note: manifest digest changed: ${digest} -> ${pushed}"
                    digest="$pushed"
                  fi
                  CREATE_ARGS+=("${dst_repo}@${digest}")
                done <<< "${ENTRIES}"

                if [ "${arch_ok}" = "true" ] && [ "${#CREATE_ARGS[@]}" -gt 0 ]; then
                  echo "  create manifest list -> ${target}"
                  docker buildx imagetools create -t "${target}" "${CREATE_ARGS[@]}" && copy_ok=true
                fi
              fi
            else
              echo "  copy -> ${target} (all architectures)"
              skopeo copy \
                --all \
                "docker://${image}" \
                "docker://${target}" && copy_ok=true
            fi

            if [ "${copy_ok}" = "true" ]; then
              echo "OK: ${image}"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "FAIL: ${image}"
              FAILED=$((FAILED + 1))
              FAILED_IMAGES="${FAILED_IMAGES}${image}"$'\n'
            fi

            echo "::endgroup::"
          done <<< "${IMAGES}"

          # 输出结果供后续步骤使用
          echo "success=${SUCCESS}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "failed_images<<EOF"
            echo "${FAILED_IMAGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Mirror Summary"
            echo ""
            echo "| Status | Count |"
            echo "|--------|-------|"
            echo "| Success | ${SUCCESS} |"
            echo "| Failed  | ${FAILED} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${FAILED}" -gt 0 ]; then
            exit 1
          fi

      - name: Notify DingTalk
        if: always() && steps.diff.outputs.has_images == 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SUCCESS: ${{ steps.copy.outputs.success }}
          FAILED: ${{ steps.copy.outputs.failed }}
          FAILED_IMAGES: ${{ steps.copy.outputs.failed_images }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCE_SYNC: ${{ inputs.force_sync || github.event.inputs.force_sync || 'false' }}
        run: |
          set -uo pipefail

          # 未配置钉钉 webhook 则跳过
          if [ -z "${DINGTALK_WEBHOOK}" ]; then
            echo "DINGTALK_WEBHOOK not set, skipping notification."
            exit 0
          fi

          # 计算加签（如果配置了密钥）
          WEBHOOK="${DINGTALK_WEBHOOK}"
          if [ -n "${DINGTALK_SECRET}" ]; then
            timestamp=$(date +%s%3N)
            string_to_sign="${timestamp}\n${DINGTALK_SECRET}"
            sign=$(printf '%b' "${string_to_sign}" \
              | openssl dgst -sha256 -hmac "${DINGTALK_SECRET}" -binary \
              | base64)
            sign_encoded=$(python3 -c \
              "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${sign}")
            WEBHOOK="${DINGTALK_WEBHOOK}&timestamp=${timestamp}&sign=${sign_encoded}"
          fi

          # 判断状态
          if [ "${FAILED}" -gt 0 ] && [ "${SUCCESS}" -gt 0 ]; then
            TITLE="❌ 镜像同步部分失败"
            STATUS="❌ 部分失败"
          elif [ "${FAILED}" -gt 0 ]; then
            TITLE="❌ 镜像同步失败"
            STATUS="❌ 全部失败"
          else
            TITLE="✅ 镜像同步完成"
            STATUS="✅ 全部成功"
          fi

          # 触发方式
          if [ "${FORCE_SYNC}" = "true" ]; then
            TRIGGER="手动触发（强制全量同步）"
          else
            TRIGGER="推送 images.txt"
          fi

          # 构造 markdown 消息
          NL=$'\n'
          TEXT="## ${TITLE}${NL}"
          TEXT+="${NL}**状态：** ${STATUS}${NL}"
          TEXT+="${NL}**触发方式：** ${TRIGGER}${NL}"
          TEXT+="${NL}**成功：** ${SUCCESS}${NL}"
          TEXT+="${NL}**失败：** ${FAILED}${NL}"

          if [ -n "${FAILED_IMAGES}" ]; then
            TEXT+="${NL}**失败镜像：**${NL}"
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              TEXT+="- ${img}${NL}"
            done <<< "${FAILED_IMAGES}"
          fi

          TEXT+="${NL}[查看详情](${RUN_URL})"

          # 发送钉钉消息
          PAYLOAD=$(jq -n \
            --arg title "${TITLE}" \
            --arg text "${TEXT}" \
            '{msgtype:"markdown", markdown:{title:$title, text:$text}}')

          RESPONSE=$(curl -s -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "DingTalk response: ${RESPONSE}"
