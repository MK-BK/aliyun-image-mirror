name: Mirror Images to Aliyun ACR

on:
  push:
    branches:
      - main
    paths:
      - 'images.txt'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制全量同步 images.txt 中所有镜像（忽略 diff）'
        required: false
        type: boolean
        default: false

# 同一分支的多次推送按顺序执行，避免并发冲突
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于计算 diff

      - name: Get images to mirror
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCE_SYNC: ${{ inputs.force_sync || github.event.inputs.force_sync || 'false' }}
        run: |
          set -uo pipefail

          if [ "${FORCE_SYNC}" = "true" ]; then
            # 手动触发 — 全量同步文件中所有镜像
            echo "Force sync: processing ALL images in images.txt"
            ADDED=$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' images.txt | sort -u)
          elif [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            # 首次推送到分支 — 文件中所有镜像都视为新增
            ADDED=$(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' images.txt | sort -u)
          else
            # 仅取新增行（以 + 开头），忽略删除行（以 - 开头）
            ADDED=$(git diff "${BEFORE}" "${AFTER}" -- images.txt \
              | grep '^+' \
              | grep -v '^+++' \
              | sed 's/^+//' \
              | sed '/^[[:space:]]*#/d' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u \
              || true)
          fi

          if [ -z "${ADDED}" ]; then
            echo "No images to mirror."
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<images_end"
              echo "${ADDED}"
              echo "images_end"
            } >> "$GITHUB_OUTPUT"
            COUNT=$(echo "${ADDED}" | wc -l)
            echo "Found ${COUNT} image(s) to mirror."
          fi

      - name: Install skopeo
        if: steps.diff.outputs.has_images == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Login to Aliyun ACR
        if: steps.diff.outputs.has_images == 'true'
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          skopeo login "${ALIYUN_REGISTRY}" \
            -u "${ALIYUN_USERNAME}" \
            --passwd-stdin <<< "${ALIYUN_PASSWORD}"

      - name: Copy images with skopeo
        if: steps.diff.outputs.has_images == 'true'
        env:
          IMAGES: ${{ steps.diff.outputs.images }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          set -uo pipefail

          SUCCESS=0
          FAILED=0

          while IFS= read -r image; do
            [ -z "$image" ] && continue

            echo "::group::Mirror: ${image}"
            target="${ALIYUN_REGISTRY}/${image}"

            echo "  copy -> ${target} (all architectures)"

            if skopeo copy \
              --multi-arch system \
              "docker://${image}" \
              "docker://${target}"; then
              echo "OK: ${image}"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "FAIL: ${image}"
              FAILED=$((FAILED + 1))
            fi

            echo "::endgroup::"
          done <<< "${IMAGES}"

          {
            echo "## Mirror Summary"
            echo ""
            echo "| Status | Count |"
            echo "|--------|-------|"
            echo "| Success | ${SUCCESS} |"
            echo "| Failed  | ${FAILED} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${FAILED}" -gt 0 ]; then
            exit 1
          fi
